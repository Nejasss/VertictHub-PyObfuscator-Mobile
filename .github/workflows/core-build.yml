name: Core Host Build Backend

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Build mode (protected_python, pyinstaller, cython_native, embedded_build, native_launcher, rust_launcher)"
        required: true
        default: "pyinstaller"
      target_platform:
        description: "Target ABI/OS (linux-x86_64, linux-arm64, windows-x64, android-arm64-ndk)"
        required: true
        default: "linux-x86_64"
      output_filename:
        description: "Output binary name"
        required: true
        default: "app_protected_bin"
      onefile:
        description: "Bundle into single file"
        required: false
        default: "true"
      console:
        description: "Enable console subsystem"
        required: false
        default: "true"
      cython_guard:
        description: "Enable Cython Guard"
        required: false
        default: "true"
      wrap_mode:
        description: "Wrapper mode"
        required: false
        default: "py"
      run_leak_scan:
        description: "Run post-build leak scan"
        required: false
        default: "true"
      sign_manifest:
        description: "Sign launch manifest"
        required: false
        default: "false"

jobs:
  host-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Host Toolchains
        run: |
          python -m pip install --upgrade pip
          pip install pycryptodome==3.21.0 pyinstaller cython
      - name: Execute Host Build Runner
        run: |
          python build-backend/scripts/run_backend_build.py \
            --input tests/fixtures/sample_app.py \
            --mode "${{ github.event.inputs.build_mode }}" \
            --target "${{ github.event.inputs.target_platform }}" \
            --output-dir artifacts \
            --output-name "${{ github.event.inputs.output_filename }}" \
            --onefile "${{ github.event.inputs.onefile }}" \
            --console "${{ github.event.inputs.console }}" \
            --cython-guard "${{ github.event.inputs.cython_guard }}" \
            --run-leak-scan "${{ github.event.inputs.run_leak_scan }}"
      - name: Upload Built Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vh-core-build-${{ github.event.inputs.build_mode }}-${{ github.event.inputs.target_platform }}
          path: artifacts/
