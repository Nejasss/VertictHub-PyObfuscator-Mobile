name: Android Studio & Python Core CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify-core-and-tests:
    name: Verify 34 Core Modules & Python Adapter Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pycryptodome==3.21.0
      - name: Audit all 34 mandatory vh.core modules
        run: python scripts/verify_core_inventory.py
      - name: Run Python adapter & integration test suites
        env:
          PYTHONPATH: app/src/main/python
        run: python -m unittest discover -v -s tests -t . -p "test_*.py"

  build-android-apk:
    name: Build Android Debug APK (ARM64)
    runs-on: ubuntu-latest
    needs: verify-core-and-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build Debug APK via Gradle
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; fi
          gradle assembleDebug --no-daemon --stacktrace
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VertictHub-PyObfuscator-debug-apk
          path: app/build/outputs/apk/debug/*.apk
